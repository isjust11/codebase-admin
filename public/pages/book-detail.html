<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Readbox</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.5/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/epub.js/0.3.93/epub.min.js"></script>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --ink: #1a1a2e;
            --ink-light: #44445a;
            --ink-muted: #8888a0;
            --cream: #faf8f5;
            --warm: #f3efe8;
            --accent: #c45d3e;
            --border: #e8e4dd;
            --white: #ffffff;
        }

        body {
            font-family: 'DM Sans', system-ui, sans-serif;
            background: var(--cream);
            color: var(--ink);
            line-height: 1.65;
            -webkit-font-smoothing: antialiased;
        }

        /* HEADER */
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1rem 6%;
            background: var(--white);
            border-bottom: 1px solid var(--border);
        }
        .top-bar a { text-decoration: none; }
        .back-link {
            color: var(--ink-light); font-size: 0.9rem; font-weight: 500;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--ink); }
        .top-logo {
            font-family: 'DM Serif Display', serif;
            font-size: 1.1rem; color: var(--ink);
        }

        /* DETAIL */
        .detail-wrap {
            max-width: 820px; margin: 2.5rem auto;
            padding: 0 2rem;
        }
        .detail-layout {
            display: flex; gap: 2.5rem;
        }
        .cover-col { flex-shrink: 0; }
        .cover-img {
            width: 200px; border-radius: 6px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            background: var(--warm);
        }
        .info-col {
            flex: 1; display: flex; flex-direction: column;
            justify-content: center;
        }
        .detail-title {
            font-family: 'DM Serif Display', serif;
            font-size: 1.8rem; font-weight: 400;
            line-height: 1.25; margin-bottom: 0.4rem;
        }
        .detail-author {
            color: var(--accent); font-weight: 600;
            font-size: 0.95rem; margin-bottom: 1.2rem;
        }
        .detail-desc {
            color: var(--ink-light); font-size: 0.92rem;
            line-height: 1.7; margin-bottom: 1.8rem;
            max-height: 180px; overflow-y: auto;
        }
        .read-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; }
        .btn-read {
            display: inline-flex; align-items: center; gap: 0.4rem;
            padding: 0.6rem 1.3rem; border-radius: 6px;
            border: none; cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            font-weight: 600; font-size: 0.9rem;
            background: var(--ink); color: var(--cream);
            transition: background 0.2s;
        }
        .btn-read:hover { background: #2d2d48; }
        .no-file { color: var(--ink-muted); font-size: 0.9rem; }

        .app-banner {
            margin-top: 2.5rem; padding: 1.5rem;
            background: var(--white); border: 1px solid var(--border);
            border-radius: 8px; text-align: center;
        }
        .app-banner p {
            color: var(--ink-light); font-size: 0.88rem;
            margin-bottom: 0.6rem;
        }
        .app-banner a {
            color: var(--accent); text-decoration: none;
            font-weight: 600; font-size: 0.88rem; margin: 0 0.4rem;
        }
        .app-banner a:hover { text-decoration: underline; }

        .loading-msg {
            text-align: center; padding: 4rem 2rem;
            color: var(--ink-muted); font-size: 0.95rem;
        }

        /* READER OVERLAY */
        .reader-overlay {
            position: fixed; inset: 0;
            background: var(--white); z-index: 100;
            display: none; flex-direction: column;
        }
        .reader-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.6rem 1.5rem;
            background: var(--ink); color: var(--cream);
        }
        .reader-bar h3 {
            font-size: 0.9rem; font-weight: 600;
            white-space: nowrap; overflow: hidden;
            text-overflow: ellipsis; max-width: 70%;
        }
        .btn-close {
            background: rgba(255,255,255,0.12); color: var(--cream);
            border: none; padding: 0.35rem 0.9rem;
            border-radius: 4px; cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            font-weight: 600; font-size: 0.85rem;
        }
        .btn-close:hover { background: rgba(255,255,255,0.2); }

        #viewer-area {
            flex: 1; position: relative;
            overflow: hidden; background: #fefefe;
        }
        .page-nav {
            position: absolute; top: 50%; transform: translateY(-50%);
            width: 100%; display: flex; justify-content: space-between;
            padding: 0 0.5rem; pointer-events: none;
        }
        .page-nav button {
            pointer-events: auto;
            background: var(--ink); color: var(--cream);
            border: none; border-radius: 50%;
            width: 36px; height: 36px;
            font-size: 1rem; cursor: pointer;
            opacity: 0.7; transition: opacity 0.2s;
        }
        .page-nav button:hover { opacity: 1; }
        #epub-viewer { width: 100%; height: 100%; }
        iframe.pdf-frame { width: 100%; height: 100%; border: none; }

        @media (max-width: 640px) {
            .detail-layout { flex-direction: column; align-items: center; text-align: center; }
            .cover-img { width: 160px; }
            .read-actions { justify-content: center; }
            .detail-title { font-size: 1.4rem; }
        }
    </style>
</head>

<body>
    <div class="top-bar">
        <a href="/" class="back-link">&larr; Trang chủ</a>
        <a href="/" class="top-logo">Readbox</a>
    </div>

    <div class="detail-wrap">
        <div id="content">
            <div class="loading-msg">Đang tải thông tin sách...</div>
        </div>
    </div>

    <!-- Reader -->
    <div class="reader-overlay" id="reader-overlay">
        <div class="reader-bar">
            <h3 id="reader-title"></h3>
            <button class="btn-close" onclick="closeReader()">Đóng</button>
        </div>
        <div id="viewer-area"></div>
    </div>

    <script>
        let bookTitle = '';
        let rendition = null;

        document.addEventListener('DOMContentLoaded', async () => {
            const id = new URLSearchParams(location.search).get('id');
            if (!id) return showMsg('Không tìm thấy sách.');

            try {
                const res = await fetch('/api/book/' + id);
                const json = await res.json();
                if (json.status && json.data) {
                    const book = json.data;
                    bookTitle = book.title;
                    document.title = book.title + ' — Readbox';
                    renderDetail(book);
                } else {
                    showMsg('Sách không tồn tại hoặc chưa được công khai.');
                }
            } catch (e) {
                showMsg('Không thể kết nối tới máy chủ.');
            }
        });

        function url(v) {
            if (!v) return '';
            return v.startsWith('http') ? v : '/' + v;
        }

        function renderDetail(book) {
            const cover = book.coverImageUrl ? url(book.coverImageUrl) : '';
            const files = book.files || [];

            let btns = '';
            if (!files.length) {
                btns = '<span class="no-file">Chưa có file để đọc.</span>';
            } else {
                files.forEach(f => {
                    const ext = (f.format || '').toUpperCase();
                    btns += `<button class="btn-read" onclick="openReader('${url(f.fileUrl)}','${ext}')">Đọc ${ext}</button>`;
                });
            }

            document.getElementById('content').innerHTML = `
                <div class="detail-layout">
                    <div class="cover-col">
                        ${cover
                            ? `<img src="${cover}" alt="${book.title}" class="cover-img" onerror="this.style.background='var(--warm)';this.alt=''">`
                            : `<div class="cover-img" style="width:200px;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;color:var(--ink-muted);font-size:0.85rem;">Chưa có ảnh bìa</div>`}
                    </div>
                    <div class="info-col">
                        <h1 class="detail-title">${book.title}</h1>
                        <div class="detail-author">${book.author || 'Chưa rõ tác giả'}</div>
                        <div class="detail-desc">${book.description ? book.description.replace(/\n/g, '<br>') : 'Chưa có mô tả.'}</div>
                        <div class="read-actions">${btns}</div>
                    </div>
                </div>
                <div class="app-banner">
                    <p>Trải nghiệm đọc tốt hơn trên ứng dụng di động</p>
                    <a href="https://play.google.com/store/apps/details?id=com.hungvv.readbox" target="_blank">Google Play</a>
                    <a href="https://apps.apple.com/us/app/readbox/id6761289734" target="_blank">App Store</a>
                </div>
            `;
        }

        function showMsg(t) {
            document.getElementById('content').innerHTML = '<div class="loading-msg">' + t + '</div>';
        }

        function openReader(fileUrl, type) {
            const overlay = document.getElementById('reader-overlay');
            const area = document.getElementById('viewer-area');
            document.getElementById('reader-title').textContent = bookTitle;
            area.innerHTML = '';
            rendition = null;
            overlay.style.display = 'flex';
            document.body.style.overflow = 'hidden';

            if (type === 'EPUB' || fileUrl.toLowerCase().endsWith('.epub')) {
                area.innerHTML = '<div id="epub-viewer"></div><div class="page-nav"><button onclick="rendition.prev()">&lsaquo;</button><button onclick="rendition.next()">&rsaquo;</button></div>';
                const book = ePub(fileUrl);
                rendition = book.renderTo('epub-viewer', { width: '100%', height: '100%', spread: 'none' });
                rendition.display();
            } else if (type === 'PDF' || fileUrl.toLowerCase().endsWith('.pdf')) {
                area.innerHTML = '<iframe src="' + fileUrl + '#toolbar=0" class="pdf-frame"></iframe>';
            } else {
                area.innerHTML = '<div class="loading-msg">Định dạng ' + type + ' không hỗ trợ đọc trên web. Vui lòng dùng ứng dụng Readbox.</div>';
            }
        }

        function closeReader() {
            document.getElementById('reader-overlay').style.display = 'none';
            document.getElementById('viewer-area').innerHTML = '';
            document.body.style.overflow = '';
            rendition = null;
        }
    </script>
</body>

</html>
