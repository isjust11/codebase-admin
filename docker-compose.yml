# Hạ tầng phụ trợ cho module OCR (và có thể mở rộng cho service khác).
#
# Cách dùng:
#   docker compose up -d            # khởi động RabbitMQ
#   docker compose ps               # xem trạng thái + healthcheck
#   docker compose logs -f rabbitmq
#   docker compose down             # dừng (giữ data nhờ named volume)
#
# Management UI: http://localhost:15672  (user/pass theo RABBITMQ_DEFAULT_*)
# AMQP endpoint: amqp://<user>:<pass>@localhost:5672
#
# Lưu ý: user mặc định "guest" chỉ kết nối được từ localhost (loopback) nên khi
# app chạy ngoài container nối vào sẽ bị chặn → ta tạo user riêng bằng
# RABBITMQ_DEFAULT_USER / RABBITMQ_DEFAULT_PASS.

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: smartreader-rabbitmq
    hostname: smartreader-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-smartreader}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-123456}
    ports:
      - "5672:5672"   # AMQP cho backend + worker
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ──────────────────────────────────────────────────────────────────────────
  # Worker Python PaddleOCR (Phase 5). Consume `ocr.jobs`, publish `ocr.results`
  # qua cùng RabbitMQ. Scale: `docker compose up -d --scale codebase-ocr=N`.
  # ──────────────────────────────────────────────────────────────────────────
  codebase-ocr:
    build: ../codebase-ocr
    image: smartreader-ocr-worker
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      # Trong mạng compose, host của broker là tên service "rabbitmq"
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-smartreader}:${RABBITMQ_DEFAULT_PASS:-123456}@rabbitmq:5672
      OCR_JOBS_QUEUE: ${OCR_JOBS_QUEUE:-ocr.jobs}
      OCR_RESULTS_QUEUE: ${OCR_RESULTS_QUEUE:-ocr.results}
      OCR_PREFETCH: ${OCR_PREFETCH:-2}
      OCR_RENDER_DPI: ${OCR_RENDER_DPI:-240}
      OCR_DEFAULT_LANG: ${OCR_DEFAULT_LANG:-vi}
      OCR_EXTRACT_IMAGES: ${OCR_EXTRACT_IMAGES:-true}
      OCR_USE_GPU: "false"
      # Tái dùng S3 của backend để tải file & upload ảnh tách ra
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

volumes:
  rabbitmq_data:
    name: smartreader_rabbitmq_data
