# Hạ tầng phụ trợ cho module OCR (và có thể mở rộng cho service khác).
#
# Cách dùng:
#   docker compose up -d            # khởi động RabbitMQ
#   docker compose ps               # xem trạng thái + healthcheck
#   docker compose logs -f rabbitmq
#   docker compose down             # dừng (giữ data nhờ named volume)
#
# Management UI: http://localhost:15672  (user/pass theo RABBITMQ_DEFAULT_*)
# AMQP endpoint: amqp://<user>:<pass>@localhost:5672
#
# Lưu ý: user mặc định "guest" chỉ kết nối được từ localhost (loopback) nên khi
# app chạy ngoài container nối vào sẽ bị chặn → ta tạo user riêng bằng
# RABBITMQ_DEFAULT_USER / RABBITMQ_DEFAULT_PASS.

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: readbox-rabbitmq
    hostname: readbox-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-readbox}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-readbox123}
    ports:
      - "5672:5672"   # AMQP cho backend + worker
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ──────────────────────────────────────────────────────────────────────────
  # Worker Python PaddleOCR (Phase 5). Bỏ comment khi repo `codebase-ocr` sẵn
  # sàng. Worker consume `ocr.jobs` và publish `ocr.results` qua cùng RabbitMQ.
  # ──────────────────────────────────────────────────────────────────────────
  # codebase-ocr:
  #   build: ../codebase-ocr
  #   container_name: readbox-ocr-worker
  #   restart: unless-stopped
  #   depends_on:
  #     rabbitmq:
  #       condition: service_healthy
  #   environment:
  #     # Trong mạng compose, host của broker là tên service "rabbitmq"
  #     RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-readbox}:${RABBITMQ_DEFAULT_PASS:-readbox123}@rabbitmq:5672
  #     OCR_JOBS_QUEUE: ocr.jobs
  #     OCR_RESULTS_QUEUE: ocr.results
  #     OCR_PREFETCH: 2
  #     OCR_RENDER_DPI: 240
  #     OCR_USE_GPU: "false"
  #     # Tái dùng S3 của backend để tải file & upload ảnh tách ra
  #     S3_ENDPOINT: ${S3_ENDPOINT}
  #     S3_REGION: ${S3_REGION}
  #     S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
  #     S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
  #     S3_BUCKET_NAME: ${S3_BUCKET_NAME}

volumes:
  rabbitmq_data:
    name: readbox_rabbitmq_data
